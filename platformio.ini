[platformio]
src_dir = src
default_envs = lilygo_vga32

[env:lilygo_vga32]
; LILYGO FabGL VGA32 V1.4, using the 8-color VGA pins and PS/2 keyboard.
; Platform 6.12.0 supplies Arduino-ESP32 2.0.17, the supported FabGL ceiling.
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DQL32_BOARD_LILYGO_VGA32
  -I include
  -I boards/lilygo_vga32
build_src_filter = +<platform/fabgl_vga/main.cpp> +<platform/fabgl_vga/graphics.cpp> +<platform/fabgl_vga/keyboard.cpp> +<platform/esp32/clock.cpp> +<platform/esp32/sd_storage.cpp> +<platform/esp32/sd_channels.cpp> +<language/interpreter.cpp> +<vm/interpreter.cpp> +<runtime/ui_service.cpp>
lib_deps = https://github.com/fdivitto/FabGL.git#v1.0.9
monitor_speed = 115200

# ESP32-2432S028R Cheap Yellow Display uses serial input and ILI9341 TFT output.
[env:esp32_2432s028]
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DQL32_BOARD_ESP32_2432S028
  -I include
  -I boards/esp32_2432s028
build_src_filter = +<platform/esp32_cyd/main.cpp> +<platform/esp32_cyd/graphics.cpp> +<platform/esp32_cyd/text_console.cpp> +<platform/esp32/clock.cpp> +<platform/esp32/sd_storage.cpp> +<platform/esp32/sd_channels.cpp> +<language/interpreter.cpp> +<vm/interpreter.cpp> +<runtime/ui_service.cpp>
lib_deps =
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit ILI9341@^1.6.1
monitor_speed = 115200

# Future ESP32-S3 TFT platform; distinct from the ESP32 CYD target above.
[env:esp32s3_tft]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
build_flags = -DQL32_BOARD_ESP32S3_TFT

