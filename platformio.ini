[platformio]
src_dir = src
; A plain `pio run` builds both supported hardware profiles, not an implicit
; single board. Use `pio run -e <environment>` when selecting or uploading one.
default_envs = lilygo_vga32, esp32_2432s028_spiffs, olimex_esp32_sbc_fabgl

[common]
portable_src_filter =
  +<language/*.cpp>
  +<graphics/*.cpp>
  +<runtime/*.cpp>
  +<ui/*.cpp>
  +<vm/*.cpp>

[env:lilygo_vga32]
; LILYGO FabGL VGA32 V1.4, using the 8-color VGA pins and PS/2 keyboard.
; Platform 6.12.0 supplies Arduino-ESP32 2.0.17, the supported FabGL ceiling.
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
board_build.partitions = boards/esp32_4mb_single_app.csv
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DQL32_BOARD_LILYGO_VGA32
  -I include
  -I boards/lilygo_vga32
build_src_filter =
  ${common.portable_src_filter}
  +<platform/fabgl_vga/main.cpp>
  +<platform/fabgl_vga/graphics.cpp>
  +<platform/fabgl_vga/frame_presenter.cpp>
  +<platform/fabgl_vga/display_modes.cpp>
  +<platform/fabgl_vga/keyboard.cpp>
  +<platform/esp32/*.cpp>
lib_deps = https://github.com/fdivitto/FabGL.git#v1.0.9
monitor_speed = 115200

[env:olimex_esp32_sbc_fabgl]
; Olimex ESP32-SBC-FabGL Rev B. The VGA/PS2 pins match the LILYGO adapter,
; while SD MISO is GPIO35 rather than GPIO2. This image uses internal FFS.
extends = env:lilygo_vga32
build_src_filter =
  ${env:lilygo_vga32.build_src_filter}
  +<platform/olimex_vga/*.cpp>
board_build.partitions = boards/esp32_4mb_olimex_ffs.csv
board_build.filesystem = spiffs
build_flags =
  -std=gnu++17
  -DQL32_BOARD_OLIMEX_ESP32_SBC_FABGL
  -DQL32_OLIMEX_USE_SPIFFS
  -DARDUINO_LOOP_STACK_SIZE=8192
  -I include
  -I boards/olimex_esp32_sbc_fabgl

; Optional Olimex Rev B profile using the ESP32-WROVER-KIT board definition
; so the module's 8 MiB PSRAM is initialized and exposed to malloc().
[env:olimex_esp32_sbc_fabgl_psram]
extends = env:olimex_esp32_sbc_fabgl
board = esp-wrover-kit
build_flags =
  -std=gnu++17
  -DQL32_BOARD_OLIMEX_ESP32_SBC_FABGL
  -DQL32_OLIMEX_USE_SPIFFS
  -DQL32_OLIMEX_PSRAM
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -mfix-esp32-psram-cache-strategy=memw
  -DARDUINO_LOOP_STACK_SIZE=16384
  -I include
  -I boards/olimex_esp32_sbc_fabgl

; Test-only VGA scanout vertical slice. It replaces the FabGL display setup
; with a PSRAM color-bar source and internal DMA line-ring descriptor chain.
; The normal Olimex PSRAM profile above remains the FabGL fallback.
[env:olimex_esp32_sbc_fabgl_psram_dma_test]
extends = env:olimex_esp32_sbc_fabgl_psram
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram.build_flags}
  -DQL32_OLIMEX_DMA_TEST_SCANOUT

# ESP32-2432S028R Cheap Yellow Display uses serial input and ILI9341 TFT output.
[env:esp32_2432s028]
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
board_build.partitions = boards/esp32_4mb_single_app.csv
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DQL32_BOARD_ESP32_2432S028
  -DARDUINO_LOOP_STACK_SIZE=16384
  -I include
  -I boards/esp32_2432s028
build_src_filter =
  ${common.portable_src_filter}
  +<platform/esp32_cyd/main.cpp>
  +<platform/esp32_cyd/graphics.cpp>
  +<platform/esp32_cyd/frame_presenter.cpp>
  +<platform/esp32_cyd/text_console.cpp>
  +<platform/esp32_cyd/touch_input.cpp>
  +<platform/esp32/*.cpp>
lib_deps =
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit ILI9341@^1.6.1
monitor_speed = 115200

; Preferred CYD runtime profile: internal SPIFFS mounted as FFS. The base
; esp32_2432s028 environment remains available for SD-only deployments.
[env:esp32_2432s028_spiffs]
extends = env:esp32_2432s028
board_build.partitions = boards/esp32_4mb_spiffs_1mb.csv
board_build.filesystem = spiffs
build_flags =
  ${env:esp32_2432s028.build_flags}
  -DQL32_CYD_USE_SPIFFS
  -DQL32_HEAP_DIAGNOSTICS

; Diagnostic image with DWARF symbols for resolving captured Xtensa PCs.
[env:esp32_2432s028_spiffs_debug]
extends = env:esp32_2432s028_spiffs
build_type = debug
debug_build_flags = -Og -g3 -ggdb

# Future ESP32-S3 TFT platform; distinct from the ESP32 CYD target above.
[env:esp32s3_tft]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
build_flags = -DQL32_BOARD_ESP32S3_TFT

; TENSTAR TS-ESP32-S3: ESP32-S3FH4R2, 4 MiB flash, QSPI PSRAM,
; 135x240 ST7789 TFT, and USB serial REPL. Sensor services are not included.
[env:ql32_tenstar_esp32s3]
platform = espressif32@6.12.0
framework = arduino
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi
board_build.partitions = boards/esp32_4mb_spiffs_512kb.csv
board_build.filesystem = spiffs
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DQL32_BOARD_TENSTAR_ESP32S3
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_LOOP_STACK_SIZE=16384
  -I include
  -I boards/ql32_tenstar_esp32s3
build_src_filter =
  ${common.portable_src_filter}
  +<platform/tenstar_esp32s3/main.cpp>
  +<platform/tenstar_esp32s3/graphics.cpp>
  +<platform/tenstar_esp32s3/frame_presenter.cpp>
  +<platform/tenstar_esp32s3/text_console.cpp>
  +<platform/esp32/arduino_hardware.cpp>
  +<platform/esp32/clock.cpp>
  +<platform/esp32/cpu_frequency.cpp>
  +<platform/esp32/drive_router.cpp>
  +<platform/esp32/line_ui_presenter.cpp>
  +<platform/esp32/memory.cpp>
  +<platform/esp32/monitor_transfer.cpp>
  +<platform/esp32/network.cpp>
  +<platform/esp32/remote_debug_protocol.cpp>
  +<platform/esp32/sd_channels.cpp>
  +<platform/esp32/sd_storage.cpp>
  +<platform/esp32/system_control.cpp>
lib_deps =
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
monitor_speed = 115200

