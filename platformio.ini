; Embedded profiles are intentionally inactive until M0 hardware qualification
; pins Arduino-ESP32 / ESP-IDF and graphics-library revisions.
[platformio]
src_dir = src
default_envs = lilygo_vga32

[env:lilygo_vga32]
platform = espressif32
framework = arduino
board = esp32dev
build_flags = -DQL32_BOARD_LILYGO_VGA32

[env:esp32s3_tft]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
build_flags = -DQL32_BOARD_ESP32S3_TFT

