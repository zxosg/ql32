[platformio]
src_dir = src
default_envs = lilygo_vga32

[env:lilygo_vga32]
; LILYGO FabGL VGA32 V1.4, using the 8-color VGA pins and PS/2 keyboard.
; Platform 6.12.0 supplies Arduino-ESP32 2.0.17, the supported FabGL ceiling.
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DQL32_BOARD_LILYGO_VGA32
  -I include
  -I boards/lilygo_vga32
build_src_filter = +<platform/fabgl_vga/main.cpp> +<platform/fabgl_vga/graphics.cpp>
lib_deps = https://github.com/fdivitto/FabGL.git#v1.0.9
monitor_speed = 115200

# Future TFT platform; M5's first hardware integration target is lilygo_vga32.
[env:esp32s3_tft]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
build_flags = -DQL32_BOARD_ESP32S3_TFT

