[platformio]
src_dir = src
; A plain `pio run` builds both supported hardware profiles, not an implicit
; single board. Use `pio run -e <environment>` when selecting or uploading one.
default_envs = lilygo_vga32, esp32_2432s028_spiffs, olimex_esp32_sbc_fabgl

[common]
portable_src_filter =
  +<language/*.cpp>
  +<graphics/*.cpp>
  +<music/*.cpp>
  +<runtime/*.cpp>
  +<ui/*.cpp>
  +<vm/*.cpp>

[env:lilygo_vga32]
; LILYGO FabGL VGA32 V1.4, using the 8-color VGA pins and PS/2 keyboard.
; Platform 6.12.0 supplies Arduino-ESP32 2.0.17, the supported FabGL ceiling.
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
board_build.partitions = boards/esp32_4mb_single_app.csv
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DQL32_BOARD_LILYGO_VGA32
  -I include
  -I boards/lilygo_vga32
build_src_filter =
  ${common.portable_src_filter}
  +<platform/fabgl_vga/main.cpp>
  +<platform/fabgl_vga/graphics.cpp>
  +<platform/fabgl_vga/frame_presenter.cpp>
  +<platform/fabgl_vga/display_modes.cpp>
  +<platform/fabgl_vga/keyboard.cpp>
  +<platform/esp32/*.cpp>
lib_deps = https://github.com/fdivitto/FabGL.git#v1.0.9
monitor_speed = 115200

[env:olimex_esp32_sbc_fabgl]
; Olimex ESP32-SBC-FabGL Rev B. The VGA/PS2 pins match the LILYGO adapter,
; while SD MISO is GPIO35 rather than GPIO2. This image uses internal FFS.
extends = env:lilygo_vga32
build_src_filter =
  ${env:lilygo_vga32.build_src_filter}
  +<platform/olimex_vga/*.cpp>
board_build.partitions = boards/esp32_4mb_olimex_ffs.csv
board_build.filesystem = spiffs
build_flags =
  -std=gnu++17
  -DQL32_BOARD_OLIMEX_ESP32_SBC_FABGL
  -DQL32_OLIMEX_USE_SPIFFS
  -DARDUINO_LOOP_STACK_SIZE=8192
  -I include
  -I boards/olimex_esp32_sbc_fabgl

; Optional Olimex Rev B profile using the ESP32-WROVER-KIT board definition
; so the module's 8 MiB PSRAM is initialized and exposed to malloc().
[env:olimex_esp32_sbc_fabgl_psram]
extends = env:olimex_esp32_sbc_fabgl
board = esp-wrover-kit
build_flags =
  -std=gnu++17
  -DQL32_BOARD_OLIMEX_ESP32_SBC_FABGL
  -DQL32_OLIMEX_USE_SPIFFS
  -DQL32_OLIMEX_PSRAM
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -mfix-esp32-psram-cache-strategy=memw
  -DARDUINO_LOOP_STACK_SIZE=16384
  -I include
  -I boards/olimex_esp32_sbc_fabgl

; Test FabGL's native two-buffer scanout with QL/32's raw scanline presenter.
; This keeps the proven FabGL sync engine and allocates the hidden viewport
; from internal DMA-capable RAM.
[env:olimex_esp32_sbc_fabgl_psram_double_buffer_test]
extends = env:olimex_esp32_sbc_fabgl_psram
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram.build_flags}
  -DQL32_OLIMEX_FABGL_DOUBLE_BUFFER_TEST

; Instrument row composition, scanline writes, swaps, and full-frame fallbacks.
[env:olimex_esp32_sbc_fabgl_graphics_profile]
extends = env:olimex_esp32_sbc_fabgl_psram_double_buffer_test
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_double_buffer_test.build_flags}
  -DQL32_GRAPHICS_PROFILE

; Test-only VGA scanout vertical slice. It replaces the FabGL display setup
; with a PSRAM color-bar source and internal DMA line-ring descriptor chain.
; The normal Olimex PSRAM profile above remains the FabGL fallback.
[env:olimex_esp32_sbc_fabgl_psram_dma_test]
extends = env:olimex_esp32_sbc_fabgl_psram
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram.build_flags}
  -DQL32_OLIMEX_DMA_TEST_SCANOUT

; Same scanout test with two packed 4-bit palette indices per framebuffer byte.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test.build_flags}
  -DQL32_OLIMEX_DMA_TEST_PACKED4

; Measure refill duration and backlog without running the CPU framebuffer benchmark.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4.build_flags}
  -DQL32_OLIMEX_DMA_REFILL_PROFILE

; Same scanout profile with the concurrent PSRAM write worker disabled.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_idle]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile.build_flags}
  -DQL32_OLIMEX_DMA_NO_STRESS_TEST

; Compare the same packed-4 modeline/descriptor chain without EOF interrupts
; or live ring refills, keeping the profiler output and stress disabled.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_static]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_idle
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_idle.build_flags}
  -DQL32_OLIMEX_DMA_TEST_STATIC_SCANOUT

; Increase the 320x200 refill lead from 50 to 150 logical rows while keeping
; the same 50-row worker batch and no-stress profiler for an A/B comparison.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200_idle]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_idle
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_idle.build_flags}
  -DQL32_OLIMEX_DMA_RING200_TEST

; 200-row ring with profiling and the concurrent PSRAM stress writer enabled.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile.build_flags}
  -DQL32_OLIMEX_DMA_RING200_TEST

; Keep the 200-row live-refill path but use a fixed triangle instead of the
; moving/palette-cycling bars to isolate per-pixel animation work.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200_idle_triangle]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200_idle
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200_idle.build_flags}
  -DQL32_OLIMEX_DMA_TEST_TRIANGLE

; Exercise packed-4 row conversion with scrolling and palette cycling using the
; precomputed pair LUT instead of the scalar per-pixel encoder.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200_idle_shift_lut]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200_idle
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200_idle.build_flags}
  -DQL32_OLIMEX_DMA_TEST_PACKED4_SHIFT_ENCODER

; Keep the moving bars and shifted-row encoder but disable palette rotation.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200_idle_shift_lut_fixed_palette]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200_idle_shift_lut
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200_idle_shift_lut.build_flags}
  -DQL32_OLIMEX_DMA_TEST_NO_PALETTE_ROTATION

; Keep a full-screen high-transition checker fixed while reusing the 200-row
; ring and pair-LUT encoder. Palette rotation is disabled for this isolation.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200_idle_checker_lut]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200_idle
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200_idle.build_flags}
  -DQL32_OLIMEX_DMA_TEST_CHECKER
  -DQL32_OLIMEX_DMA_TEST_PACKED4_SHIFT_ENCODER

; Eight full-width horizontal bands test repeated row boundaries on the same
; no-stress 200-row ring and packed-4 pair-LUT path.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200_idle_bands_lut]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200_idle
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200_idle.build_flags}
  -DQL32_OLIMEX_DMA_TEST_HORIZONTAL_BANDS
  -DQL32_OLIMEX_DMA_TEST_PACKED4_SHIFT_ENCODER

; Moving full-width gradient with palette cycling for high-transition testing.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200_idle_gradient_lut]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200_idle
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200_idle.build_flags}
  -DQL32_OLIMEX_DMA_TEST_GRADIENT
  -DQL32_OLIMEX_DMA_TEST_PACKED4_SHIFT_ENCODER

; Repeat the moving-gradient test with concurrent PSRAM writes enabled.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200_gradient_lut_stress]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200.build_flags}
  -DQL32_OLIMEX_DMA_TEST_GRADIENT
  -DQL32_OLIMEX_DMA_TEST_PACKED4_SHIFT_ENCODER

; Repeat the full-width band-boundary test with concurrent PSRAM writes.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200_bands_lut_stress]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200.build_flags}
  -DQL32_OLIMEX_DMA_TEST_HORIZONTAL_BANDS
  -DQL32_OLIMEX_DMA_TEST_PACKED4_SHIFT_ENCODER

; Rotate the checker palette while keeping source pixels and row shift fixed.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200_checker_lut_rotate]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200_idle_checker_lut
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4_profile_ring200_idle_checker_lut.build_flags}
  -DQL32_OLIMEX_DMA_TEST_ROTATE_PALETTE

; First full-height test: PSRAM framebuffer plus an internal DMA line ring.
; Keep this diagnostic opt-in; the normal FabGL PSRAM profile remains fallback.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_400x300_packed4]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4.build_flags}
  -DQL32_OLIMEX_DMA_TEST_MODE_400X300

; Isolate 400x300 modeline/descriptor stability from live refill scheduling.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_400x300_static]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_400x300_packed4
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_400x300_packed4.build_flags}
  -DQL32_OLIMEX_DMA_TEST_STATIC_SCANOUT

; Increase active-ring lead to 75 logical rows for the 300-row mode.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_400x300_ring150]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_400x300_packed4
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_400x300_packed4.build_flags}
  -DQL32_OLIMEX_DMA_RING150_TEST
  ; Move high-resolution refill work off core 0 to check CPU contention.
  -DQL32_OLIMEX_DMA_REFILL_CORE1_TEST

; Full-height VGA mode using packed-4 PSRAM and a core-1 refill worker.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_640x480_packed4]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4.build_flags}
  -DQL32_OLIMEX_DMA_TEST_MODE_640X480
  -DQL32_OLIMEX_DMA_REFILL_CORE1_TEST

; Compare the supported compiler PSRAM cache workaround strategies.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_640x480_dupldst]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_640x480_packed4
build_unflags =
  -std=gnu++11
  -mfix-esp32-psram-cache-strategy=memw
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_640x480_packed4.build_flags}
  -mfix-esp32-psram-cache-strategy=dupldst

; Compare a deeper ring and smaller refill groups under PSRAM contention.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_640x480_ring160]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_640x480_packed4
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_640x480_packed4.build_flags}
  -DQL32_OLIMEX_DMA_RING160_TEST

[env:olimex_esp32_sbc_fabgl_psram_dma_test_640x480_ring160_idle]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_640x480_ring160
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_640x480_ring160.build_flags}
  -DQL32_OLIMEX_DMA_NO_STRESS_TEST

[env:olimex_esp32_sbc_fabgl_psram_dma_test_640x480_restart]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_640x480_ring160_idle
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_640x480_ring160_idle.build_flags}
  -DQL32_OLIMEX_DMA_RESTART_TEST

; Determine whether a saturated refill worker starves the diagnostic loop.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_640x480_ring160_priority1]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_640x480_ring160
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_640x480_ring160.build_flags}
  -DQL32_OLIMEX_DMA_REFILL_PRIORITY1_TEST

; 640x400 packed-4 scanout profile for modeline and full-height qualification.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_640x400_packed4]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4.build_flags}
  -DQL32_OLIMEX_DMA_TEST_MODE_640X400
  -DQL32_OLIMEX_DMA_REFILL_CORE1_TEST

; Profile a genuinely scrolling source gradient at 640x400 under PSRAM stress.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_640x400_gradient_stress_profile]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_640x400_packed4
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_640x400_packed4.build_flags}
  -DQL32_OLIMEX_DMA_REFILL_PROFILE
  -DQL32_OLIMEX_DMA_TEST_GRADIENT
  -DQL32_OLIMEX_DMA_TEST_PACKED4_SHIFT_ENCODER
  -DQL32_OLIMEX_DMA_TEST_FORCE_SOURCE_SHIFT

; Profile a scrolling source gradient at 640x480 with the 120-row ring and stress.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_640x480_gradient_stress_profile]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_640x480_packed4
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_640x480_packed4.build_flags}
  -DQL32_OLIMEX_DMA_REFILL_PROFILE
  -DQL32_OLIMEX_DMA_TEST_GRADIENT
  -DQL32_OLIMEX_DMA_TEST_PACKED4_SHIFT_ENCODER
  -DQL32_OLIMEX_DMA_TEST_FORCE_SOURCE_SHIFT

; Direct high-frequency pixel-order test without BASIC composition/presentation.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_pixel_edges]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4.build_flags}
  -DQL32_OLIMEX_DMA_TEST_PIXEL_EDGES

; Black screen with only one packed-4, 45-degree right triangle.
[env:olimex_esp32_sbc_fabgl_psram_dma_test_triangle]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4.build_flags}
  -DQL32_OLIMEX_DMA_TEST_TRIANGLE

; Benchmark direct framebuffer writes to a spare PSRAM scanout frame while
; the diagnostic source frame is continuously read by DMA.
[env:olimex_esp32_sbc_fabgl_dma_framebuffer_benchmark]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test.build_flags}
  -DQL32_OLIMEX_DMA_FRAMEBUFFER_BENCHMARK

[env:olimex_esp32_sbc_fabgl_dma_framebuffer_benchmark_packed4]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_test_packed4.build_flags}
  -DQL32_OLIMEX_DMA_FRAMEBUFFER_BENCHMARK

; Runtime QL/32 graphics over the qualified PSRAM DMA VGA scanout path.
[env:olimex_esp32_sbc_fabgl_psram_dma_display]
extends = env:olimex_esp32_sbc_fabgl_psram
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram.build_flags}
  -DQL32_OLIMEX_DMA_DISPLAY
  -DQL32_OLIMEX_DMA_TEST_PACKED4

; RGB222 runtime comparison profile for isolating packed-4 glyph artifacts.
[env:olimex_esp32_sbc_fabgl_psram_dma_display_rgb222]
extends = env:olimex_esp32_sbc_fabgl_psram
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram.build_flags}
  -DQL32_OLIMEX_DMA_DISPLAY

; Diagnostic variant retains the moving-bar/refill counters while running QL/32 startup.
[env:olimex_esp32_sbc_fabgl_psram_dma_display_diagnostic]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_display
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_display.build_flags}
  -DQL32_OLIMEX_DMA_DISPLAY_DIAGNOSTIC

; Compare a frame-aligned 200-row ring with 50-row refill batches under
; runtime drawing load. Adds 32 KiB of internal DMA memory over the 100-row ring.
[env:olimex_esp32_sbc_fabgl_psram_dma_display_ring200_test]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_display
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_display.build_flags}
  -DQL32_OLIMEX_DMA_RING200_TEST

[env:olimex_esp32_sbc_fabgl_psram_dma_display_ring200_priority_test]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_display_ring200_test
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_display_ring200_test.build_flags}
  -DQL32_OLIMEX_DMA_REFILL_PRIORITY7_TEST

; Runtime QL/32 at the first full-height mode qualified by the scanout test.
[env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_packed4]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_display
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_display.build_flags}
  -DQL32_OLIMEX_DMA_TEST_MODE_640X480
  -DQL32_OLIMEX_DMA_REFILL_CORE1_TEST

; Opt-in runtime profiles with post-test DMADIAG telemetry for high-mode tests.
[env:olimex_esp32_sbc_fabgl_psram_dma_display_640x400_profile]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_display_640x400_packed4
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_display_640x400_packed4.build_flags}
  -DQL32_OLIMEX_DMA_REFILL_PROFILE
  -DQL32_OLIMEX_DMA_STATUS_TEST

[env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_profile]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_packed4
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_packed4.build_flags}
  -DQL32_OLIMEX_DMA_REFILL_PROFILE
  -DQL32_OLIMEX_DMA_STATUS_TEST

; Keep the VGA EOF interrupt and refill worker on core 1, with QL/32's
; Arduino loop on core 0. This fixed-mode experiment isolates VGA deadlines.
[env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_split_cores_test]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_profile
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_profile.build_flags}
  -DARDUINO_RUNNING_CORE=0
  -DQL32_OLIMEX_DMA_REFILL_CORE1_TEST
  -DQL32_OLIMEX_DMA_INTERRUPT_CORE1_TEST

; Increase the split-core 640x480 ring lead to 120 rows while keeping the same
; core placement, so attractor instability can be compared against ring depth.
[env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_split_cores_ring160_test]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_split_cores_test
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_split_cores_test.build_flags}
  -DQL32_OLIMEX_DMA_RING160_TEST

; Diagnostic: 640x480 runtime plus presenter counters. Run PRESRESET before a
; workload and PRESDIAG after it; DMADIAG still reports scanout counters.
[env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_present_profile]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_profile
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_profile.build_flags}
  -DQL32_OLIMEX_PRESENT_PROFILE

; Same counters on the existing split-core placement, for A/B timing only.
[env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_present_split_cores_test]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_split_cores_test
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_split_cores_test.build_flags}
  -DQL32_OLIMEX_PRESENT_PROFILE

; Split cores plus a per-frame PSRAM byte budget for presents. Tests whether
; late refills come from PSRAM bandwidth saturation. Budget is adjustable at
; runtime with PRESBUDGET <bytes> (0 = unlimited) and shown by PRESDIAG.
[env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_present_split_budget_test]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_present_split_cores_test
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_present_split_cores_test.build_flags}
  -DQL32_OLIMEX_PRESENT_BYTES_PER_FRAME=64000

; Split cores with the refill row path placed in IRAM (no flash instruction
; cache misses on core 1); compare late refills with the plain split build.
[env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_present_split_iram_test]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_present_split_cores_test
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_present_split_cores_test.build_flags}
  -DQL32_OLIMEX_DMA_REFILL_IRAM_TEST

; Split cores with a bulk PSRAM->internal RAM copy of each source row before
; encoding; tests whether scattered PSRAM reads dominate refill time.
[env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_present_split_bulk_test]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_present_split_cores_test
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_present_split_cores_test.build_flags}
  -DQL32_OLIMEX_DMA_REFILL_BULK_COPY_TEST

; Bulk row copy plus a 160-row ring refilled in 20-row batches.
[env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_present_split_bulk_g20_test]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_present_split_bulk_test
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_present_split_bulk_test.build_flags}
  -DQL32_OLIMEX_DMA_RING160_GROUP20_TEST

; Experimental synchronous mode switching for integration testing.
[env:olimex_esp32_sbc_fabgl_psram_dma_dynamic_mode_test]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_packed4
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_display_640x480_packed4.build_flags}
  -DQL32_OLIMEX_DMA_DYNAMIC_MODE_TEST

; Runtime QL/32 at 400x300 with the 75-row lead that passed scanout testing.
[env:olimex_esp32_sbc_fabgl_psram_dma_display_400x300_packed4]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_display
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_display.build_flags}
  -DQL32_OLIMEX_DMA_TEST_MODE_400X300
  -DQL32_OLIMEX_DMA_RING150_TEST
  -DQL32_OLIMEX_DMA_REFILL_CORE1_TEST

; Runtime QL/32 at 640x400 using the 100-row packed-4 line ring.
[env:olimex_esp32_sbc_fabgl_psram_dma_display_640x400_packed4]
extends = env:olimex_esp32_sbc_fabgl_psram_dma_display
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram_dma_display.build_flags}
  -DQL32_OLIMEX_DMA_TEST_MODE_640X400
  -DQL32_OLIMEX_DMA_REFILL_CORE1_TEST

; Benchmarks FabGL Canvas drawing against PSRAM RGB222 framebuffer operations.
[env:olimex_esp32_sbc_fabgl_render_benchmark]
extends = env:olimex_esp32_sbc_fabgl_psram
build_flags =
  ${env:olimex_esp32_sbc_fabgl_psram.build_flags}
  -DQL32_OLIMEX_RENDER_BENCHMARK

# ESP32-2432S028R Cheap Yellow Display uses serial input and ILI9341 TFT output.
[env:esp32_2432s028]
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
board_build.partitions = boards/esp32_4mb_single_app.csv
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DQL32_BOARD_ESP32_2432S028
  -DARDUINO_LOOP_STACK_SIZE=16384
  -I include
  -I boards/esp32_2432s028
build_src_filter =
  ${common.portable_src_filter}
  +<platform/esp32_cyd/main.cpp>
  +<platform/esp32_cyd/graphics.cpp>
  +<platform/esp32_cyd/frame_presenter.cpp>
  +<platform/esp32_cyd/text_console.cpp>
  +<platform/esp32_cyd/touch_input.cpp>
  +<platform/esp32/*.cpp>
lib_deps =
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit ILI9341@^1.6.1
monitor_speed = 115200

; Preferred CYD runtime profile: internal SPIFFS mounted as FFS. The base
; esp32_2432s028 environment remains available for SD-only deployments.
[env:esp32_2432s028_spiffs]
extends = env:esp32_2432s028
board_build.partitions = boards/esp32_4mb_spiffs_1mb.csv
board_build.filesystem = spiffs
build_flags =
  ${env:esp32_2432s028.build_flags}
  -DQL32_CYD_USE_SPIFFS
  -DQL32_HEAP_DIAGNOSTICS

; Diagnostic image with DWARF symbols for resolving captured Xtensa PCs.
[env:esp32_2432s028_spiffs_debug]
extends = env:esp32_2432s028_spiffs
build_type = debug
debug_build_flags = -Og -g3 -ggdb

# Future ESP32-S3 TFT platform; distinct from the ESP32 CYD target above.
[env:esp32s3_tft]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
build_flags = -DQL32_BOARD_ESP32S3_TFT

; TENSTAR TS-ESP32-S3: ESP32-S3FH4R2, 4 MiB flash, QSPI PSRAM,
; 135x240 ST7789 TFT, and USB serial REPL. Sensor services are not included.
[env:ql32_tenstar_esp32s3]
platform = espressif32@6.12.0
framework = arduino
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi
board_build.partitions = boards/esp32_4mb_spiffs_512kb.csv
board_build.filesystem = spiffs
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DQL32_BOARD_TENSTAR_ESP32S3
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_LOOP_STACK_SIZE=16384
  -I include
  -I boards/ql32_tenstar_esp32s3
build_src_filter =
  ${common.portable_src_filter}
  +<platform/tenstar_esp32s3/main.cpp>
  +<platform/tenstar_esp32s3/graphics.cpp>
  +<platform/tenstar_esp32s3/frame_presenter.cpp>
  +<platform/tenstar_esp32s3/text_console.cpp>
  +<platform/esp32/arduino_hardware.cpp>
  +<platform/esp32/clock.cpp>
  +<platform/esp32/cpu_frequency.cpp>
  +<platform/esp32/drive_router.cpp>
  +<platform/esp32/line_ui_presenter.cpp>
  +<platform/esp32/memory.cpp>
  +<platform/esp32/monitor_transfer.cpp>
  +<platform/esp32/network.cpp>
  +<platform/esp32/remote_debug_protocol.cpp>
  +<platform/esp32/sd_channels.cpp>
  +<platform/esp32/sd_storage.cpp>
  +<platform/esp32/system_control.cpp>
lib_deps =
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
monitor_speed = 115200

